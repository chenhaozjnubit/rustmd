name: Windows

# `cargo build` happens on the host, but the project is a GUI binary: a
# cross-compiled artifact is only as trustworthy as the linker that produced it.
# Building on a real Windows runner keeps that question out of the picture, and
# it is also the only way to actually run the test suite on Windows.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build rustmd.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      # Runs the same suite the macOS build runs. `--locked` so CI fails loudly
      # if Cargo.lock and Cargo.toml ever disagree instead of silently
      # re-resolving.
      - name: Test
        run: cargo test --release --locked

      # Which files the font lookups settled on, in the log. A face index is
      # resolved by reading the font's `name` table, and only a real Windows
      # machine can say whether the answer is right; without this the log stays
      # silent on the one thing one cannot check from macOS.
      - name: Report the fonts resolved on Windows
        run: cargo test --release --locked fonts::tests -- --nocapture

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/rustmd.exe staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath rustmd-windows-x64.zip -Force

      - name: Show artefact
        shell: pwsh
        run: |
          Get-Item rustmd-windows-x64.zip | Select-Object Name, Length
          Get-Item target/release/rustmd.exe | Select-Object Name, Length

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: rustmd-windows-x64
          path: rustmd-windows-x64.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustmd-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: rustmd-windows-x64.zip
          generate_release_notes: true
